openapi: 3.0.3
info:
  title: Lotus Funds API
  version: 1.0.0
  description: |
    Documentation for the existing Lotus Funds Express API.
    Response envelopes intentionally differ where the implementation differs.
servers:
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Authentication
  - name: RA Registration
  - name: Broker Registration
  - name: Research Calls
  - name: Performance
  - name: Notifications
  - name: Telegram
  - name: WhatsApp
  - name: Subscriptions
  - name: Payments
  - name: Audit
  - name: Admin
  - name: Health

paths:
  /check:
    get:
      tags: [Health]
      summary: Check API availability
      security: []
      responses:
        "200":
          description: Plain-text health response
          content:
            text/plain:
              schema:
                type: string
                example: APP WORKING

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT and authenticated user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/password-setup/validate:
    get:
      tags: [Authentication]
      summary: Validate a password-setup token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 64
            maxLength: 64
      responses:
        "200":
          description: Token validity details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  valid: { type: boolean }
                  email: { type: string, format: email }
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/password-setup:
    post:
      tags: [Authentication]
      summary: Complete password setup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/auth/request-otp:
    post:
      tags: [Authentication]
      summary: Request an OTP through the legacy password flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/verify-otp-and-set-password:
    post:
      tags: [Authentication]
      summary: Verify an OTP and set a password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, password]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/auth/admin/change-password:
    post:
      tags: [Authentication, Admin]
      summary: Change the authenticated Admin password
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/registration/register-ra:
    post:
      tags: [RA Registration]
      summary: Submit an RA registration
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RARegistrationForm"
      responses:
        "201":
          description: Registration submitted; the response includes the next subscription step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationSubmission"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/registration/{applicationId}/select-plan:
    post:
      tags: [Subscriptions, RA Registration]
      summary: Select a registration subscription plan
      security: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/RegistrationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string, format: uuid }
      responses:
        "200":
          description: Selected plan and registration status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/registration/all-registrations:
    get:
      tags: [RA Registration, Admin]
      summary: List paid RA registrations pending approval
      description: Allowed roles are ADMIN and SUPERADMIN. Returns a bare JSON array.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending RA registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/registration/all-registrations-active-users:
    get:
      tags: [RA Registration, Admin]
      summary: List active RA users
      description: Allowed roles are ADMIN and SUPERADMIN. Returns a bare JSON array.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active RA users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/registration/ra/{id}:
    get:
      tags: [RA Registration, Admin]
      summary: Get an RA registration
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: RA registration details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/broker/{id}:
    get:
      tags: [Broker Registration, Admin]
      summary: Get a Broker registration
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Broker registration details
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/edit/ra/{id}:
    put:
      tags: [RA Registration, Admin]
      summary: Update an RA registration
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RARegistrationForm"
      responses:
        "200":
          description: Updated RA registration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/edit/broker/{id}:
    put:
      tags: [Broker Registration, Admin]
      summary: Update a Broker registration
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BrokerRegistrationForm"
      responses:
        "200":
          description: Updated Broker registration
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/reject/{type}/{id}:
    put:
      tags: [RA Registration, Broker Registration, Admin]
      summary: Reject a paid or unpaid registration and reconcile any refund
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [RA, BROKER]
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Rejection or refund state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Refund provider reconciliation is required

  /api/registration/research/disclaimer:
    get:
      tags: [RA Registration]
      summary: Get the authenticated RA disclaimer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Disclaimer snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [RA Registration]
      summary: Update the authenticated RA disclaimer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disclaimer]
              properties:
                disclaimer: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/registration/ra/change-password:
    post:
      tags: [RA Registration]
      summary: Change the authenticated RA password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/registration/ra/profile-update-request:
    post:
      tags: [RA Registration]
      summary: Submit an RA profile update request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RARegistrationForm"
      responses:
        "201":
          description: Profile update request created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/registration/ra-profile-update-requests:
    get:
      tags: [RA Registration, Admin]
      summary: List RA profile update requests
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Bare array of update requests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/registration/ra-profile-update-requests/{id}/approve:
    put:
      tags: [RA Registration, Admin]
      summary: Approve an RA profile update request
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/registration/ra-profile-update-requests/{id}/reject:
    put:
      tags: [RA Registration, Admin]
      summary: Reject an RA profile update request
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/profile:
    get:
      tags: [RA Registration]
      summary: Get the authenticated RA profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: RA profile
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/registration/ifsc/{ifsc}:
    get:
      tags: [RA Registration]
      summary: Look up bank details by IFSC
      security: []
      parameters:
        - name: ifsc
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bank lookup result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: IFSC provider error

  /api/broker/register-broker:
    post:
      tags: [Broker Registration]
      summary: Submit a Broker registration
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BrokerRegistrationForm"
      responses:
        "201":
          description: Broker registration and message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  broker:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/broker/all-brokers:
    get:
      tags: [Broker Registration]
      summary: List Broker records
      description: The existing route is public and returns a bare JSON array.
      security: []
      responses:
        "200":
          description: Broker records
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/approve-user:
    post:
      tags: [Admin]
      summary: Approve a paid RA or Broker registration
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicantType, entityId]
              properties:
                applicantType:
                  type: string
                  enum: [RA, BROKER]
                entityId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Approval, subscription, user, and password-setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/suspend-user:
    post:
      tags: [Admin]
      summary: Suspend an RA or Broker user
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/resend-password-link:
    post:
      tags: [Admin]
      summary: Create and resend a password-setup link
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/activate/ra/{id}:
    put:
      tags: [Admin]
      summary: Activate an RA
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/SuccessMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/history/{userId}:
    get:
      tags: [Admin]
      summary: Get disclaimer history for an RA
      description: Allowed roles are ADMIN and SUPERADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: RA identity and disclaimer history
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    nullable: true
                    additionalProperties: true
                  history:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/research/instruments:
    get:
      tags: [Research Calls]
      summary: Search instruments
      security:
        - bearerAuth: []
      parameters:
        - name: exchange
          in: query
          required: true
          schema:
            type: string
            enum: [NSE, BSE]
        - name: search
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Instrument search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Instrument provider unavailable

  /api/research/message-templates:
    get:
      tags: [Research Calls]
      summary: Get the authenticated RA's New Call and Errata layouts
      description: Returns only templates owned by the authenticated Research Analyst.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Per-RA message templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      NEW_CALL:
                        allOf:
                          - $ref: "#/components/schemas/StoredResearchCallTemplate"
                        nullable: true
                      ERRATA:
                        allOf:
                          - $ref: "#/components/schemas/StoredResearchCallTemplate"
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/research/message-templates/{messageType}:
    put:
      tags: [Research Calls]
      summary: Save one message layout for the authenticated RA
      description: Upserts a validated layout under the authenticated Research Analyst's user ID.
      security:
        - bearerAuth: []
      parameters:
        - name: messageType
          in: path
          required: true
          schema:
            type: string
            enum: [NEW_CALL, ERRATA]
      requestBody:
        required: true
        content:
          application/json:
