                - applicationId
                - razorpay_order_id
                - razorpay_payment_id
                - razorpay_signature
              properties:
                applicationId: { type: string, format: uuid }
                razorpay_order_id: { type: string }
                razorpay_payment_id: { type: string }
                razorpay_signature: { type: string }
      responses:
        "200":
          description: Payment, registration, and subscription transition result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Includes WAIT_FOR_PAYMENT_CAPTURE when the verified payment is not captured yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/payments/registration-failure:
    post:
      tags: [Payments, Subscriptions]
      summary: Reconcile a failed or cancelled registration checkout
      security: []
      parameters:
        - $ref: "#/components/parameters/RegistrationToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applicationId, razorpay_order_id]
              properties:
                applicationId: { type: string, format: uuid }
                razorpay_order_id: { type: string }
      responses:
        "200":
          description: Failed payment reconciliation result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Reconciliation is refused if an associated payment is captured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/payments/razorpay/webhook:
    post:
      tags: [Payments]
      summary: Process Razorpay webhook events using the raw request body
      security: []
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook acknowledged
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/audit-logs:
    get:
      tags: [Audit]
      summary: Query audit logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Audit log query result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/audit-logs/export:
    get:
      tags: [Audit]
      summary: Export audit logs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Audit export returned by the existing controller
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationToken:
      name: x-registration-token
      in: header
      required: true
      description: Registration-scoped token returned during registration
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      name: search
      in: query
      schema:
        type: string

  responses:
    SuccessMessage:
      description: Successful operation
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean }
              message: { type: string }
            additionalProperties: true
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user does not have the required role or subscription access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        error: { type: string }
        field: { type: string }
        nextStep: { type: string }
      additionalProperties: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: analyst@example.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token: { type: string }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            role:
              type: string
              enum: [RESEARCH_ANALYST, BROKER, ADMIN, SUPERADMIN]
            status: { type: string }
          additionalProperties: true
      additionalProperties: true

    RegistrationSubmission:
      type: object
      required:
        - success
        - message
        - ra_id
        - application_id
        - registration_token
        - next_step
      properties:
        success: { type: boolean }
        message: { type: string }
        ra_id: { type: string, format: uuid }
        application_id: { type: string, format: uuid }
        registration_token: { type: string }
        registration_token_expires_at:
          type: string
          format: date-time
        next_step:
          type: string
          example: SELECT_SUBSCRIPTION_PLAN

    ApprovalResponse:
      type: object
      required:
        - success
        - user_id
        - application_id
        - registration_status
        - subscription_status
        - email_sent
      properties:
        success: { type: boolean }
        message: { type: string }
        user_id: { type: string, format: uuid }
        username: { type: string }
        application_id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        registration_status: { type: string }
        subscription_status: { type: string }
        user_status: { type: string }
        email_sent: { type: boolean }
        email_error:
          type: string
          nullable: true
        next_step: { type: string }
      additionalProperties: true

    RARegistrationForm:
      type: object
      required:
        - first_name
        - surname
        - email
        - declare_info_true
        - consent_verification
        - no_guaranteed_returns
        - conflict_of_interest
        - personal_trading
        - sebi_compliance
        - platform_policy
      properties:
        salutation: { type: string }
        first_name: { type: string }
        middle_name: { type: string }
        surname: { type: string }
        org_name: { type: string }
        designation: { type: string }
        email: { type: string, format: email }
        mobile: { type: string }
        sebi_reg_no: { type: string }
        nism_reg_no: { type: string }
        pan_number: { type: string }
        additional_comments: { type: string }
        declare_info_true: { type: boolean }
        consent_verification: { type: boolean }
        no_guaranteed_returns: { type: boolean }
        conflict_of_interest: { type: boolean }
        personal_trading: { type: boolean }
        sebi_compliance: { type: boolean }
        platform_policy: { type: boolean }
        profile_image: { type: string, format: binary }
        pan_card: { type: string, format: binary }
        address_proof_document: { type: string, format: binary }
        sebi_certificate: { type: string, format: binary }
        sebi_receipt: { type: string, format: binary }
        nism_certificate: { type: string, format: binary }
        cancelled_cheque: { type: string, format: binary }
      additionalProperties: true

    BrokerRegistrationForm:
      type: object
      required: [legal_name, email]
      properties:
        legal_name: { type: string }
        trade_name: { type: string }
        entity_type: { type: string }
        email: { type: string, format: email }
        mobile: { type: string }
        pan: { type: string }
        sebi_registration_no: { type: string }
        sebi_certificate: { type: string, format: binary }
        exchange_certificates:
          type: array
          items: { type: string, format: binary }
        appointment_letter: { type: string, format: binary }
        networth_certificate: { type: string, format: binary }
        financial_statements: { type: string, format: binary }
        ca_certificate: { type: string, format: binary }
      additionalProperties: true

    ResearchCallTemplateBlock:
      type: object
      required: [id, type, enabled, locked]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [field, text, heading, separator]
        fieldKey: { type: string }
        text:
          type: string
          maxLength: 500
        enabled: { type: boolean }
        locked: { type: boolean }
      additionalProperties: false

    ResearchCallMessageTemplate:
      type: object
      required: [version, blocks]
      properties:
        version:
          type: integer
          enum: [1]
        blocks:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ResearchCallTemplateBlock"
      additionalProperties: false

    StoredResearchCallTemplate:
      type: object
      properties:
        messageType:
          type: string
          enum: [NEW_CALL, ERRATA]
        templateVersion:
          type: integer
          minimum: 1
        template:
          $ref: "#/components/schemas/ResearchCallMessageTemplate"
        updatedAt:
          type: string
          format: date-time

    ResearchCallForm:
      type: object
      required:
        - status
        - exchange_type
        - market_type
        - symbol
        - display_name
        - action
        - call_type
        - trade_type
        - entry_price
        - target_price
        - stop_loss
      properties:
        status: { type: string }
        message_text: { type: string }
        message_template_version:
          type: integer
          nullable: true
        message_template_snapshot:
          type: string
          nullable: true
          description: JSON-encoded validated template snapshot used for this multipart publication.
        exchange_type: { type: string, enum: [NSE, BSE] }
        market_type: { type: string }
        symbol: { type: string }
        display_name: { type: string }
        action: { type: string, enum: [BUY, SELL] }
        call_type: { type: string }
        trade_type: { type: string }
        expiry_date: { type: string, format: date }
        entry_price: { type: number }
        entry_price_low: { type: number }
        entry_price_upper: { type: number }
        target_price: { type: number }
        target_price_2: { type: number }
        target_price_3: { type: number }
        stop_loss: { type: number }
        stop_loss_2: { type: number }
        stop_loss_3: { type: number }
        holding_period: { type: string }
        rationale: { type: string }
        underlying_study: { type: string }
        research_remarks: { type: string }
        file: { type: string, format: binary }

    ResearchCall:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        created_at: { type: string, format: date-time }
        is_latest: { type: boolean }
        version_type: { type: string }
        exchange: { type: string }
        instrument: { type: string }
        symbol: { type: string }
        name: { type: string }
        action: { type: string }
        call_type: { type: string }
        trade_type: { type: string }
        expiry_date:
          type: string
          nullable: true
        entry:
          type: object
          properties:
            low: { type: number, nullable: true }
            ideal: { type: number, nullable: true }
            high: { type: number, nullable: true }
        targets:
          type: array
          items: { type: number }
        stop_losses:
          type: array
          items: { type: number }
        published_message_text:
          type: string
          nullable: true
          description: Exact message snapshot used when this version was published.
        message_template_version:
          type: integer
          nullable: true
        message_template_snapshot:
          allOf:
            - $ref: "#/components/schemas/ResearchCallMessageTemplate"
          nullable: true
      additionalProperties: true

    HistoryRow:
      type: object
      properties:
        date_time: { type: string, format: date-time }
        action: { type: string }
        exchange: { type: string }
        type: { type: string }
        category: { type: string }
        instrument: { type: string }
        symbol: { type: string }
        expiry:
          type: string
          nullable: true
        entry:
          oneOf:
            - { type: number }
            - { type: string }
        exit_price:
          oneOf:
            - { type: number }
            - { type: string }
          nullable: true
        status: { type: string }
        profit_loss: { type: number }
        researcher_name: { type: string }

    PerformanceResponse:
      type: object
      required: [success, month, metrics]
      properties:
        success: { type: boolean }
        month: { type: string, example: "2026-07" }
        metrics:
          type: object
          properties:
            total: { type: number }
            active: { type: number }
            exited: { type: number }
            accuracy: { type: number }
            profit: { type: number }
            adverse: { type: number }
            strike: { type: number }
            sl: { type: number }
            early: { type: number }
            rr:
              type: number
              nullable: true
            last:
              type: array
              items:
                type: string
                enum: [g, r, n]
          additionalProperties: true
